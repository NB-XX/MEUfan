<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEU Live Subtitle Search</title>
<link rel="stylesheet" href="/assets/index.css">

</head>
<body>

<div class="header">
  <div class="logo">MEU字幕搜索</div>
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="search" id="modeSearchBtn">Search</button>
    <button class="mode-btn" data-mode="browse" id="modeBrowseBtn">Browse</button>
  </div>
  <div class="search-wrap" id="searchWrap">
    <input type="text" id="searchInput" placeholder="Search subtitles..." autocomplete="off" disabled>
    <button class="clear-btn" id="clearBtn" title="Clear">✕</button>
  </div>
  <div class="header-right">
    <div class="source-switch" id="sourceSwitch" title="Video source">
      <button class="source-option active" id="sourceYoutubeBtn" type="button" data-source="youtube">YouTube</button>
      <button class="source-option" id="sourceBilibiliBtn" type="button" data-source="bilibili">Bilibili</button>
    </div>
    <span class="result-count" id="resultCount"></span>
    <button class="btn-reload" id="btnReload" title="Reload all data">Reload</button>
  </div>
</div>

<div class="main">
  <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Toggle sidebar">‹</button>
  <!-- Results Panel -->
  <div class="results-panel" id="resultsPanel">
    <div class="empty-state" id="emptyState">
      <div class="icon"></div>
      <p>Enter a keyword to search all subtitles.</p>
    </div>
    <div class="results-list" id="resultsList" style="display:none"></div>
    <div class="browse-view" id="browseView" style="display:none">
      <div class="browse-toolbar">
        <select id="browseSort"><option value="newest">Newest</option><option value="title">Title</option></select>
        <label class="filter-check"><input type="checkbox" id="filterHasSubs"> <span id="filterHasSubsLabel">With subtitles only</span></label>
        <select id="filterLang"><option value="">All languages</option><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </div>
  </div>

  <!-- Video Panel -->
  <div class="video-panel" id="videoPanel">
    <button class="mobile-results-toggle" id="mobileResultsToggle" type="button">Results</button>
    <div class="player-container" id="playerContainer">
      <div class="youtube-player" id="youtubePlayer"></div>
      <iframe class="bilibili-player hidden" id="bilibiliPlayer" allow="fullscreen; autoplay" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="player-placeholder" id="playerPlaceholder">
        <div class="icon"></div>
        <p>검색 결과에서 자막을 클릭하면<br>영상이 여기에 재생됩니다</p>
      </div>
      <div class="floating-subtitle hidden" id="floatingSubtitle"></div>
    </div>
    <div class="video-info-bar" id="videoInfoBar">
      <img class="thumb-sm" id="videoInfoThumb" src="" onerror="this.style.display='none'">
      <span id="videoInfoTitle"></span>
      <div class="lang-controls">
        <select id="langSelect"><option value="ko">한국어</option></select>
        <label class="bilingual-toggle" id="bilingualToggle" title="Bilingual mode">
          <input type="checkbox" id="bilingualCheck">⇆ 双语字幕
        </label>
        <select id="bilingualLangSelect" style="display:none"><option value="en">English</option></select>
      </div>
      <button class="video-tool-btn active" id="floatingSubtitleBtn" type="button" title="Toggle floating subtitles">CC</button>
      <button class="video-tool-btn" id="playerFullscreenBtn" type="button" title="Fullscreen with floating subtitles">Fullscreen</button>
      <button class="video-tool-btn" id="downloadSubBtn" type="button" title="Download current subtitle">Download</button>
      <button class="video-tool-btn hidden" id="editSubtitleBtn" type="button" title="Edit current subtitle">Edit</button>
      <input class="local-subtitle-search hidden" id="localSubtitleSearch" type="text" autocomplete="off" placeholder="Search in this subtitle">
    </div>
    <div class="subtitle-overlay" id="subtitleOverlay">
      <div class="no-subs-hint">자막이 여기에 표시됩니다</div>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div class="edit-modal" id="editModal">
  <div class="edit-card">
    <h3>Edit subtitle</h3>
    <div class="edit-row">
      <label class="edit-field">Start <input id="editStart" type="number" step="0.001" min="0"></label>
      <label class="edit-field">End <input id="editEnd" type="number" step="0.001" min="0"></label>
    </div>
    <label class="edit-field">Text <textarea id="editText"></textarea></label>
    <div class="edit-actions"><button id="editCancelBtn" type="button">Cancel</button><button class="primary" id="editSaveBtn" type="button">Save</button></div>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="inner">
    <div class="spinner"></div>
    <p>자막 데이터 로딩 중...</p>
    <p style="font-size:10px;margin-top:2px" id="loadingDetail"></p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</div>

<script src="/assets/index.js"></script>
</body>
</html>
