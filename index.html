<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEU Live Subtitle Search</title>
<style>
/* ===== Fonts ===== */
@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Nunito:wght@400;600;700;800&display=swap');

/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a14;--bg2:#0d0d1f;--surface:rgba(22,22,42,0.65);--surface2:rgba(30,30,55,0.72);
  --glass:rgba(20,20,44,0.55);--glass-border:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.07);--text:#e8dff0;--text-dim:#a898c0;
  --cat-pink:#ff8eb5;--cat-purple:#b388e0;--cat-blue:#7ec8e3;
  --cat-green:#7dcea0;--cat-silver:#b8b8d0;
  --accent:var(--cat-pink);--accent2:var(--cat-purple);--accent3:#e74c3c;
  --highlight:rgba(255,142,181,0.4);--highlight-current:rgba(179,136,224,0.45);
  --font:'Nunito','Zen Maru Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  --font-display:'Zen Maru Gothic','Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  --glow-pink:0 0 20px rgba(255,142,181,0.3);--glow-purple:0 0 20px rgba(179,136,224,0.3);
  --radius-sm:10px;--radius:16px;--radius-lg:24px;
}
html,body{height:100%;height:100dvh;overflow:hidden}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  animation:pageFadeIn 0.8s ease;
}
/* Dreamcore background: radial glows at corners */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 600px 500px at 0% 0%,rgba(255,142,181,0.06),transparent),
    radial-gradient(ellipse 500px 450px at 100% 0%,rgba(179,136,224,0.05),transparent),
    radial-gradient(ellipse 550px 480px at 0% 100%,rgba(126,200,227,0.04),transparent),
    radial-gradient(ellipse 450px 420px at 100% 100%,rgba(125,206,160,0.04),transparent),
    radial-gradient(ellipse 350px 300px at 50% 50%,rgba(200,180,220,0.03),transparent);
}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== Header ===== */
.header{
  background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border-bottom:1px solid var(--glass-border);padding:10px 18px;display:flex;
  align-items:center;gap:12px;flex-shrink:0;z-index:10;flex-wrap:wrap;position:relative;
}
.header .logo{
  font-family:var(--font-display);font-size:20px;font-weight:900;
  background:linear-gradient(135deg,var(--cat-pink),var(--cat-purple),var(--cat-blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;
  animation:breathingGlow 4s ease-in-out infinite;
}
@keyframes breathingGlow{
  0%,100%{filter:drop-shadow(0 0 6px rgba(255,142,181,0.4))drop-shadow(0 0 12px rgba(179,136,224,0.2))}
  50%{filter:drop-shadow(0 0 12px rgba(255,142,181,0.6))drop-shadow(0 0 24px rgba(179,136,224,0.35))}
}
/* Mode toggle */
.mode-toggle{display:flex;border-radius:9999px;overflow:hidden;border:1px solid var(--glass-border);flex-shrink:0;background:var(--surface)}
.mode-btn{padding:6px 14px;background:transparent;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:var(--font);font-weight:600;transition:all 0.25s;border-radius:9999px}
.mode-btn.active{background:linear-gradient(135deg,var(--cat-pink),var(--cat-purple));color:#fff;box-shadow:var(--glow-pink)}
.mode-btn:not(.active):hover{color:var(--text)}
/* Search */
.search-wrap{flex:1;position:relative;max-width:500px;min-width:160px}
.search-wrap::before{
  content:'🐾';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;
  pointer-events:none;z-index:1;opacity:0.5;transition:opacity 0.2s;
}
.search-wrap input{
  width:100%;padding:9px 38px 9px 34px;border:1.5px solid var(--glass-border);border-radius:9999px;
  background:var(--surface2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--text);font-size:13px;font-family:var(--font);
  outline:none;transition:all 0.25s;
}
.search-wrap input:focus{border-color:var(--cat-pink);box-shadow:0 0 0 3px rgba(255,142,181,0.12),var(--glow-pink)}
.search-wrap input:focus::before{opacity:1}
.search-wrap .clear-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,0.06);border:none;color:var(--text-dim);font-size:14px;cursor:pointer;
  padding:4px 7px;display:none;border-radius:50%;transition:all 0.2s;
}
.search-wrap .clear-btn.visible{display:block}
.search-wrap .clear-btn:hover{color:var(--text);background:rgba(255,142,181,0.2)}
/* Subtitle display controls */
.lang-controls{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lang-controls select,.lang-controls button{
  padding:6px 10px;border:1px solid var(--glass-border);border-radius:9999px;
  background:var(--surface);color:var(--text);font-size:11px;font-family:var(--font);cursor:pointer;
  transition:all 0.2s;
}
.lang-controls select:focus{outline:none;border-color:var(--cat-purple);box-shadow:0 0 0 3px rgba(179,136,224,0.1)}
.bilingual-toggle{
  display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);cursor:pointer;user-select:none;
  padding:6px 12px;border:1px solid var(--glass-border);border-radius:9999px;transition:all 0.25s;font-weight:600;
}
.bilingual-toggle.active{background:linear-gradient(135deg,var(--cat-purple),var(--cat-blue));color:#fff;border-color:transparent;box-shadow:var(--glow-purple)}
.bilingual-toggle input{display:none}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.result-count{font-size:11px;color:var(--text-dim);white-space:nowrap}
.btn-reload{
  background:var(--surface);border:1px solid var(--glass-border);color:var(--text-dim);
  padding:6px 12px;border-radius:9999px;cursor:pointer;font-size:11px;font-family:var(--font);font-weight:600;
  transition:all 0.25s;white-space:nowrap;
}
.btn-reload:hover{color:var(--text);border-color:var(--cat-pink);box-shadow:var(--glow-pink)}

/* ===== Main Layout ===== */
.main{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}
.mobile-results-toggle{
  display:none;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:10px;border:0;border-bottom:1px solid var(--glass-border);
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--text);font-size:13px;font-family:var(--font);font-weight:700;
  cursor:pointer;flex-shrink:0;transition:background 0.2s;
}
.mobile-results-toggle:hover{background:var(--surface)}

/* ===== Results Panel ===== */
.results-panel{width:420px;min-width:280px;border-right:1px solid var(--glass-border);display:flex;flex-direction:column;background:rgba(10,10,20,0.3);overflow:hidden;min-height:0}
.results-list{flex:1;overflow-y:auto;padding:6px 0}
.results-list::-webkit-scrollbar{width:4px}
.results-list::-webkit-scrollbar-thumb{background:rgba(255,142,181,0.2);border-radius:4px}
.results-list::-webkit-scrollbar-track{background:transparent}
.video-group{border-bottom:1px solid var(--glass-border)}
.video-group:last-child{border-bottom:none}
.video-group-header{
  padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:2;transition:all 0.2s;border-radius:0;
}
.video-group-header:hover{background:var(--surface2);box-shadow:var(--glow-pink)}
.video-group-header .thumb{width:44px;height:33px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;background:var(--surface2)}
.video-group-header .vtitle{
  flex:1;font-size:12px;font-weight:700;line-height:1.35;font-family:var(--font-display);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.video-group-header .vcount{
  font-size:10px;color:var(--cat-pink);flex-shrink:0;font-weight:700;
  background:rgba(255,142,181,0.12);padding:2px 8px;border-radius:9999px;
}
.video-group-header .expand-icon{font-size:9px;color:var(--text-dim);transition:transform 0.3s;flex-shrink:0}
.video-group.expanded .expand-icon{transform:rotate(180deg)}
.sub-items{display:none}
.video-group.expanded .sub-items{display:block}
.sub-item{
  padding:8px 14px 8px 22px;cursor:pointer;border-left:3px solid transparent;
  transition:all 0.2s;font-size:12px;line-height:1.55;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
}
.sub-item:hover{background:var(--surface2);border-left-color:var(--cat-pink)}
.sub-item.active{background:rgba(179,136,224,0.12);border-left-color:var(--cat-purple)}
.sub-item .sub-time{display:inline-block;color:var(--cat-pink);font-weight:700;margin-right:6px;font-size:10px;min-width:46px;cursor:pointer;font-family:var(--font-display)}
.sub-item .sub-time:hover{text-decoration:underline;color:var(--cat-purple)}
.sub-item .sub-text mark{background:var(--highlight);color:var(--text);border-radius:3px;padding:1px 3px}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--text-dim);text-align:center;padding:40px;
}
.empty-state .icon{font-size:48px;margin-bottom:10px}
.empty-state p{font-size:13px;line-height:1.7;opacity:0.8}

/* ===== Browse View ===== */
.browse-view{flex:1;display:flex;flex-direction:column;overflow-y:auto}
.browse-toolbar{
  padding:10px 14px;display:flex;gap:8px;align-items:center;flex-shrink:0;
  border-bottom:1px solid var(--glass-border);flex-wrap:wrap;
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:3;
}
.browse-toolbar select,.browse-toolbar label{
  font-size:12px;font-family:var(--font);color:var(--text);font-weight:600;
  background:var(--surface);border:1px solid var(--glass-border);
  border-radius:9999px;padding:6px 12px;cursor:pointer;transition:all 0.2s;
}
.browse-toolbar select:focus{outline:none;border-color:var(--cat-pink);box-shadow:0 0 0 3px rgba(255,142,181,0.1)}
.filter-check{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.filter-check input{accent-color:var(--cat-pink)}
.video-grid{
  padding:10px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;align-content:start;flex-shrink:0;
}
.video-grid::-webkit-scrollbar{width:4px}
.video-grid::-webkit-scrollbar-thumb{background:rgba(255,142,181,0.2);border-radius:4px}
.video-card{
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;cursor:pointer;
  transition:all 0.3s;
}
.video-card:hover{border-color:var(--cat-pink);transform:translateY(-3px);box-shadow:var(--glow-pink),0 8px 32px rgba(0,0,0,0.3)}
.video-card .card-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface2);display:block;min-height:95px}
.video-card .card-body{padding:10px 12px}
.video-card .card-title{
  font-size:12px;font-weight:700;line-height:1.35;font-family:var(--font-display);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;
}
.video-card .card-meta{font-size:10px;color:var(--text-dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===== Language Badges ===== */
.lang-badge{
  display:inline-block;font-size:9px;padding:2px 6px;border-radius:9999px;
  margin-right:4px;font-weight:700;vertical-align:middle;line-height:1.5;
}
.lang-badge.ko{background:rgba(255,142,181,0.2);color:var(--cat-pink)}
.lang-badge.en{background:rgba(179,136,224,0.2);color:var(--cat-purple)}
.lang-badge.ja{background:rgba(231,76,60,0.2);color:#e74c3c}
.lang-badge.zh{background:rgba(125,206,160,0.2);color:var(--cat-green)}

/* ===== Video Panel ===== */
.video-panel{flex:1;display:flex;flex-direction:column;background:#050510;min-width:0;position:relative}
.player-container{position:relative;width:100%;aspect-ratio:16/9;max-height:55vh;background:#000;flex-shrink:0}
.youtube-player{position:absolute;inset:0;width:100%;height:100%}
.player-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.player-placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--text-dim);gap:10px;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(179,136,224,0.06),transparent 70%);
}
.player-placeholder .icon{font-size:52px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.floating-subtitle{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  width:min(92%,900px);z-index:5;pointer-events:none;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.floating-subtitle.hidden{display:none}
.floating-subtitle .float-line{
  display:inline-block;max-width:100%;padding:6px 16px;border-radius:12px;
  background:rgba(10,10,20,0.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,142,181,0.15);
  color:#fff;font-size:22px;font-weight:700;line-height:1.4;
  text-shadow:0 0 10px rgba(255,142,181,0.4),0 2px 4px rgba(0,0,0,0.6);
  white-space:pre-wrap;font-family:var(--font-display);
}
.floating-subtitle .float-line.secondary{
  font-size:18px;font-weight:600;border-color:rgba(179,136,224,0.15);
  text-shadow:0 0 10px rgba(179,136,224,0.4),0 2px 4px rgba(0,0,0,0.6);
}
.player-container:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;background:#000}
.player-container:fullscreen .floating-subtitle{bottom:9%}
.player-container:fullscreen .floating-subtitle .float-line{font-size:clamp(24px,4.2vw,52px)}
.player-container:fullscreen .floating-subtitle .float-line.secondary{font-size:clamp(19px,3.2vw,40px)}
.player-container:-webkit-full-screen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;background:#000}
.player-container:-webkit-full-screen .floating-subtitle{bottom:9%}
.player-container:-webkit-full-screen .floating-subtitle .float-line{font-size:clamp(24px,4.2vw,52px)}
.player-container:-webkit-full-screen .floating-subtitle .float-line.secondary{font-size:clamp(19px,3.2vw,40px)}
.video-info-bar{
  padding:9px 18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:12px;font-weight:700;display:none;align-items:center;gap:8px;flex-shrink:0;
  border-bottom:1px solid var(--glass-border);font-family:var(--font-display);
}
.video-info-bar.visible{display:flex}
.video-info-bar .thumb-sm{width:34px;height:26px;border-radius:6px;object-fit:cover;flex-shrink:0}
.video-info-bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-info-bar .lang-controls{max-width:360px;overflow-x:auto}
.local-subtitle-search{
  width:180px;max-width:36%;padding:6px 10px;border:1.5px solid var(--glass-border);border-radius:9999px;
  background:var(--surface);color:var(--text);font-size:11px;font-family:var(--font);
  transition:all 0.2s;
}
.local-subtitle-search:focus{outline:none;border-color:var(--cat-pink);box-shadow:0 0 0 3px rgba(255,142,181,0.1)}
.local-subtitle-search.hidden{display:none}
.video-tool-btn{
  flex-shrink:0;padding:6px 10px;border:1px solid var(--glass-border);border-radius:9999px;
  background:var(--surface);color:var(--text-dim);font-size:11px;font-family:var(--font);font-weight:600;
  cursor:pointer;transition:all 0.2s;
}
.video-tool-btn:hover,.video-tool-btn.active{color:#fff;border-color:var(--cat-pink);box-shadow:var(--glow-pink)}
.video-tool-btn.active{background:rgba(255,142,181,0.15)}
.subtitle-overlay{
  flex:1;overflow-y:auto;padding:14px 20px;font-size:13px;line-height:1.75;
  background:rgba(12,12,24,0.5);
}
.subtitle-overlay::-webkit-scrollbar{width:4px}
.subtitle-overlay::-webkit-scrollbar-thumb{background:rgba(179,136,224,0.25);border-radius:4px}
.subtitle-overlay::-webkit-scrollbar-track{background:transparent}
.subtitle-overlay .sub-line{
  padding:5px 10px;border-radius:8px;cursor:pointer;transition:all 0.2s;
  border-left:3px solid transparent;margin-bottom:1px;
}
.subtitle-overlay .sub-line:hover{background:var(--surface2);border-left-color:rgba(255,142,181,0.4)}
.subtitle-overlay .sub-line.current{background:var(--highlight-current);font-weight:700;border-left-color:var(--cat-purple)}
.subtitle-overlay .sub-line.ko{border-left-color:var(--cat-pink)}
.subtitle-overlay .sub-line.en{border-left-color:var(--cat-purple)}
.subtitle-overlay .sub-line.ja{border-left-color:#e74c3c}
.sub-line.zh{border-left-color:var(--cat-green)}
.subtitle-overlay .sub-line .stime{
  color:var(--cat-pink);font-size:10px;margin-right:8px;font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--font-display);
}
.subtitle-overlay .sub-line mark{background:var(--highlight);color:var(--text);border-radius:3px;padding:1px 3px}
.no-subs-hint{text-align:center;color:var(--text-dim);padding:40px;font-size:13px;opacity:0.7}

/* ===== Loading Overlay ===== */
.loading-overlay{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-family:var(--font);
  animation:pageFadeIn 0.5s ease;
}
.loading-overlay .inner{text-align:center;color:var(--text-dim);max-width:400px}
.loading-overlay .spinner{
  width:40px;height:40px;margin:0 auto 12px;
  border:3px solid var(--glass-border);border-top-color:var(--cat-pink);border-right-color:var(--cat-purple);
  border-radius:50%;animation:spin 0.8s linear infinite;
  box-shadow:0 0 16px rgba(255,142,181,0.2);
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay .progress-bar{width:100%;height:5px;background:var(--surface2);border-radius:6px;margin-top:10px;overflow:hidden}
.loading-overlay .progress-fill{height:100%;background:linear-gradient(90deg,var(--cat-pink),var(--cat-purple),var(--cat-blue));border-radius:6px;transition:width 0.3s}

/* ===== Floating Sparkle Particles ===== */
.sparkle-container{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sparkle{
  position:absolute;width:3px;height:3px;border-radius:50%;
  animation:sparkleFloat 8s ease-in-out infinite;
  opacity:0;
}
.sparkle:nth-child(1){left:8%;top:70%;background:var(--cat-pink);animation-delay:0s;animation-duration:9s}
.sparkle:nth-child(2){left:22%;top:55%;background:var(--cat-purple);animation-delay:1.5s;width:4px;height:4px}
.sparkle:nth-child(3){left:45%;top:80%;background:var(--cat-blue);animation-delay:3s;animation-duration:10s}
.sparkle:nth-child(4){left:65%;top:40%;background:var(--cat-green);animation-delay:4.5s;width:5px;height:5px}
.sparkle:nth-child(5){left:78%;top:65%;background:var(--cat-pink);animation-delay:2s;animation-duration:7.5s}
.sparkle:nth-child(6){left:15%;top:30%;background:var(--cat-silver);animation-delay:5s;width:3px;height:3px}
.sparkle:nth-child(7){left:55%;top:50%;background:var(--cat-purple);animation-delay:6s;animation-duration:8.5s;width:4px;height:4px}
.sparkle:nth-child(8){left:88%;top:25%;background:var(--cat-blue);animation-delay:3.5s;width:3px;height:3px}
@keyframes sparkleFloat{
  0%{opacity:0;transform:translateY(0) rotate(0deg) scale(0.5)}
  15%{opacity:0.8}
  30%{opacity:0.4;transform:translateY(-40px) rotate(180deg) scale(1.2)}
  50%{opacity:0.9;transform:translateY(-20px) rotate(300deg) scale(0.8)}
  70%{opacity:0.3;transform:translateY(-60px) rotate(400deg) scale(1.1)}
  85%{opacity:0.7;transform:translateY(-30px) rotate(520deg) scale(0.6)}
  100%{opacity:0;transform:translateY(-80px) rotate(720deg) scale(0.3)}
}

/* ===== Responsive ===== */
@media(max-width:768px){
  .main{flex-direction:column}
  .main.results-collapsed .results-panel{display:none}
  .mobile-results-toggle{display:flex}
  .results-panel{width:100%;min-width:0;height:34dvh;max-height:34dvh;border-right:none;border-bottom:1px solid var(--glass-border)}
  .video-panel{min-height:0;flex:1}
  .player-container{max-height:33dvh}
  .header{padding:6px 8px;gap:6px}

<body>

<script>
// ===== SRT Parser (client-side) =====
function parseSRT(text){
  var blocks=text.trim().split(/\n\s*\n/),subs=[];
  for(var i=0;i<blocks.length;i++){
    var lines=blocks[i].trim().split('\n');
    if(lines.length<2)continue;
    var m=lines[1].match(/(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})/);
    if(!m)continue;
    var start=parseInt(m[1])*3600+parseInt(m[2])*60+parseInt(m[3])+parseInt(m[4])/1000;
    var end=parseInt(m[5])*3600+parseInt(m[6])*60+parseInt(m[7])+parseInt(m[8])/1000;
    subs.push({start:Math.round(start*1000)/1000,end:Math.round(end*1000)/1000,text:lines.slice(2).join('\n').trim()});
  }
  return subs;
}

// ===== Global State =====
var videos=[];       // [{videoId,title,duration,subtitles:{"ko":[...],"en":[...]}}]
var searchIndex=[];  // [{v,s,lang,start,text}]
var dataReady=false;
var currentQuery='',localSubtitleQuery='',currentVideoIdx=-1,currentSubIdx=-1,currentResults=[];
var currentLang='ko',bilingualMode=false,bilingualLang='en';
var currentMode='search';
var player=null,playerReady=false,syncInterval=null,pendingPlay=null,floatingSubtitlesEnabled=true;

// ===== DOM Ref =====
var searchInput=document.getElementById('searchInput');
var clearBtn=document.getElementById('clearBtn');
var resultCount=document.getElementById('resultCount');
var resultsList=document.getElementById('resultsList');
var emptyState=document.getElementById('emptyState');
var browseView=document.getElementById('browseView');
var searchWrap=document.getElementById('searchWrap');
var mainEl=document.querySelector('.main');
var mobileResultsToggle=document.getElementById('mobileResultsToggle');
var playerContainer=document.getElementById('playerContainer');
var playerPlaceholder=document.getElementById('playerPlaceholder');
var floatingSubtitle=document.getElementById('floatingSubtitle');
var floatingSubtitleBtn=document.getElementById('floatingSubtitleBtn');
var playerFullscreenBtn=document.getElementById('playerFullscreenBtn');
var subtitleOverlay=document.getElementById('subtitleOverlay');
var loadingOverlay=document.getElementById('loadingOverlay');
var progressFill=document.getElementById('progressFill');
var loadingDetail=document.getElementById('loadingDetail');
var langSelect=document.getElementById('langSelect');
var bilingualToggle=document.getElementById('bilingualToggle');
var bilingualCheck=document.getElementById('bilingualCheck');
var bilingualLangSelect=document.getElementById('bilingualLangSelect');
var localSubtitleSearch=document.getElementById('localSubtitleSearch');

// ===== Language Config =====
var SUPPORTED_UI_LANGS=['ko','ja','zh','en'];
function detectUiLang(){
  var raw=(navigator.language||navigator.userLanguage||'en').toLowerCase();
  if(raw.indexOf('ko')===0)return'ko';
  if(raw.indexOf('ja')===0)return'ja';
  if(raw.indexOf('zh')===0)return'zh';
  return'en';
}
var UI_LANG=detectUiLang();
document.documentElement.lang=UI_LANG;
var UI_TEXT={
  en:{
    app:'MEU SubSearch',search:'Search',browse:'Browse',searchPlaceholder:'Search subtitles...',
    reload:'Reload',bilingual:'Bilingual',empty:'Enter a keyword to search all subtitles.',
    playerEmpty:'Click a subtitle result to play the video here.',
    subsEmpty:'Subtitles will appear here.',noVideoSubs:'This video has no subtitle data.',
    noResults:'No results for "{query}"',results:'{count} results',newest:'Newest',title:'Title',
    withSubsOnly:'With subtitles only',allLanguages:'All languages',noVideos:'No videos match the filters.',
    loadingMapping:'Loading mapping.json...',loadingSubs:'Loading subtitles...',localSearch:'Search in this subtitle',
    noLocalResults:'No matching lines in this subtitle.'
  },
  ko:{
    app:'MEU 자막 검색',search:'검색',browse:'둘러보기',searchPlaceholder:'자막 검색...',
    reload:'새로고침',bilingual:'이중 자막',empty:'검색어를 입력하면 전체 자막에서 찾아드립니다.',
    playerEmpty:'검색 결과에서 자막을 클릭하면 영상이 여기에 재생됩니다.',
    subsEmpty:'자막이 여기에 표시됩니다.',noVideoSubs:'이 영상은 자막 데이터가 없습니다.',
    noResults:'"{query}"에 대한 검색 결과가 없습니다',results:'{count}개 결과',newest:'최신순',title:'제목순',
    withSubsOnly:'자막 있는 영상만',allLanguages:'모든 언어',noVideos:'조건에 맞는 영상이 없습니다.',
    loadingMapping:'mapping.json 로딩 중...',loadingSubs:'자막 로딩 중...',localSearch:'현재 자막에서 검색',
    noLocalResults:'현재 자막에서 일치하는 줄이 없습니다.'
  },
  ja:{
    app:'MEU 字幕検索',search:'検索',browse:'一覧',searchPlaceholder:'字幕を検索...',
    reload:'再読み込み',bilingual:'二言語字幕',empty:'キーワードを入力すると、全字幕から検索します。',
    playerEmpty:'検索結果の字幕をクリックすると、ここで動画を再生します。',
    subsEmpty:'字幕はここに表示されます。',noVideoSubs:'この動画には字幕データがありません。',
    noResults:'「{query}」の検索結果はありません',results:'{count} 件',newest:'新しい順',title:'タイトル順',
    withSubsOnly:'字幕ありのみ',allLanguages:'すべての言語',noVideos:'条件に一致する動画がありません。',
    loadingMapping:'mapping.json を読み込み中...',loadingSubs:'字幕を読み込み中...',localSearch:'この字幕内を検索',
    noLocalResults:'この字幕内に一致する行がありません。'
  },
  zh:{
    app:'MEU 字幕搜索',search:'搜索',browse:'浏览',searchPlaceholder:'搜索字幕...',
    reload:'刷新',bilingual:'双语字幕',empty:'输入关键词后，会在全部字幕中搜索。',
    playerEmpty:'点击搜索结果中的字幕后，视频会在这里播放。',
    subsEmpty:'字幕会显示在这里。',noVideoSubs:'这个视频没有字幕数据。',
    noResults:'没有找到“{query}”的结果',results:'{count} 条结果',newest:'最新',title:'标题',
    withSubsOnly:'仅显示有字幕的视频',allLanguages:'所有语言',noVideos:'没有符合条件的视频。',
    loadingMapping:'正在加载 mapping.json...',loadingSubs:'正在加载字幕...',localSearch:'在当前字幕中搜索',
    noLocalResults:'当前字幕里没有匹配的行。'
  }
};
function t(key,vars){
  var str=(UI_TEXT[UI_LANG]&&UI_TEXT[UI_LANG][key])||UI_TEXT.en[key]||key;
  vars=vars||{};
  return str.replace(/\{(\w+)\}/g,function(_,k){return vars[k]!==undefined?vars[k]:''});
}
function setText(id,text){var el=document.getElementById(id);if(el)el.textContent=text;}
function setPlaceholder(id,text){var el=document.getElementById(id);if(el)el.placeholder=text;}
function applyUiText(){
  var logo=document.querySelector('.logo');if(logo)logo.textContent=t('app');
  setText('modeSearchBtn',t('search'));setText('modeBrowseBtn',t('browse'));
  setPlaceholder('searchInput',t('searchPlaceholder'));
  var reload=document.getElementById('btnReload');if(reload){reload.textContent=t('reload');reload.title=t('reload');}
  var bil=document.getElementById('bilingualToggle');if(bil){bil.childNodes[1].nodeValue=' '+t('bilingual');}
  var emptyP=emptyState&&emptyState.querySelector('p');if(emptyP)emptyP.textContent=t('empty');
  var playerP=playerPlaceholder&&playerPlaceholder.querySelector('p');if(playerP)playerP.textContent=t('playerEmpty');
  subtitleOverlay.innerHTML='<div class="no-subs-hint">🐾 '+t('subsEmpty')+'</div>';
  setPlaceholder('localSubtitleSearch',t('localSearch'));
  var browseSort=document.getElementById('browseSort');
  if(browseSort){browseSort.options[0].textContent=t('newest');browseSort.options[1].textContent=t('title');}
  setText('filterHasSubsLabel',t('withSubsOnly'));
  var filterLang=document.getElementById('filterLang');if(filterLang)filterLang.options[0].textContent=t('allLanguages');
}
var LANG_LABELS={ko:'한국어',en:'English',ja:'日本語',zh:'中文'};
var LANG_COLORS={ko:'var(--accent)',en:'var(--accent2)',ja:'var(--accent3)',zh:'#2ecc71'};
currentLang=SUPPORTED_UI_LANGS.indexOf(UI_LANG)>=0?UI_LANG:'en';
bilingualLang=currentLang==='en'?'ko':'en';

function subtitleFileUrl(filename){
  return './'+filename.split('/').map(encodeURIComponent).join('/');
}

// ===== Data Loading =====
function loadData(){
  dataReady=false;searchInput.disabled=true;
  loadingOverlay.style.display='flex';progressFill.style.width='0%';
  loadingDetail.textContent=t('loadingMapping');

  fetch('mapping.json?t='+Date.now())
    .then(function(r){return r.json()})
    .then(function(mapping){
      var vlist=mapping.videos;
      videos=new Array(vlist.length);

      // Count total SRT files to fetch
      var toFetch=[];
      for(var i=0;i<vlist.length;i++){
        var v=vlist[i];
        // Support both new (subtitles dict) and legacy (srtFile string) formats
        var subs=v.subtitles||{};
        if(!subs.ko&&!subs.en&&!subs.ja&&v.srtFile){
          subs={ko:v.srtFile}; // Legacy fallback
        }
        videos[i]={videoId:v.videoId,title:v.title,duration:v.duration||0,subtitles:{}};
        var langs=Object.keys(subs);
        for(var j=0;j<langs.length;j++){
          toFetch.push({vIdx:i,lang:langs[j],file:subs[langs[j]]});
        }
      }

      var total=toFetch.length,loaded=0;
      loadingDetail.textContent='0 / '+total+' files';

      if(total===0){finishLoading();return;}

      // Fetch all SRTs in parallel
      var promises=[];
      for(var i=0;i<toFetch.length;i++){
        (function(item){
          var p=fetch(subtitleFileUrl(item.file)+'?t='+Date.now())
            .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.text()})
            .then(function(txt){
              videos[item.vIdx].subtitles[item.lang]=parseSRT(txt);
              loaded++;
              progressFill.style.width=Math.round(loaded/total*100)+'%';
              loadingDetail.textContent=loaded+' / '+total+' files';
            })
            .catch(function(err){
              console.warn('Failed:',item.file,err);loaded++;
              progressFill.style.width=Math.round(loaded/total*100)+'%';
              loadingDetail.textContent=loaded+' / '+total+' files';
            });
          promises.push(p);
        })(toFetch[i]);
      }
      return Promise.all(promises);
    })
    .then(function(){finishLoading()})
    .catch(function(err){loadingDetail.textContent='Error: '+err.message;setTimeout(loadData,3000)});
}

function finishLoading(){
  // Build search index across ALL languages
  searchIndex=[];
  for(var vi=0;vi<videos.length;vi++){
    var langs=Object.keys(videos[vi].subtitles);
    for(var li=0;li<langs.length;li++){
      var lang=langs[li],subs=videos[vi].subtitles[lang];
      for(var si=0;si<subs.length;si++){
        searchIndex.push({v:vi,s:si,lang:lang,start:subs[si].start,text:subs[si].text});
      }
    }
  }

  // Count stats
  var withSubs=0,langCounts={};
  for(var i=0;i<videos.length;i++){
    var ls=Object.keys(videos[i].subtitles);
    if(ls.length>0)withSubs++;
    for(var j=0;j<ls.length;j++){langCounts[ls[j]]=(langCounts[ls[j]]||0)+1;}
  }
  console.log('MEU SubSearch: '+videos.length+' videos, '+withSubs+' with subs, '+searchIndex.length+' entries');
  console.log('Languages:',JSON.stringify(langCounts));

  // Update language selector
  populateLangSelects();

  dataReady=true;searchInput.disabled=false;searchInput.focus();
  loadingOverlay.style.display='none';
  showEmptyState();
}

function populateLangSelects(){
  // Collect available languages
  var avail={};
  for(var i=0;i<videos.length;i++){
    var ls=Object.keys(videos[i].subtitles);
    for(var j=0;j<ls.length;j++)avail[ls[j]]=true;
  }
  var langs=Object.keys(avail);
  if(!avail[currentLang]&&langs.length>0)currentLang=langs[0];
  if(!avail[bilingualLang]||bilingualLang===currentLang){
    bilingualLang=langs.filter(function(l){return l!==currentLang})[0]||currentLang;
  }

  // Primary language select
  langSelect.innerHTML='';
  for(var i=0;i<langs.length;i++){
    var opt=document.createElement('option');
    opt.value=langs[i];opt.textContent=LANG_LABELS[langs[i]]||langs[i];
    if(langs[i]===currentLang)opt.selected=true;
    langSelect.appendChild(opt);
  }

  // Bilingual secondary language select
  bilingualLangSelect.innerHTML='';
  for(var i=0;i<langs.length;i++){
    if(langs[i]===currentLang)continue;
    var opt=document.createElement('option');
    opt.value=langs[i];opt.textContent=LANG_LABELS[langs[i]]||langs[i];
    if(langs[i]===bilingualLang)opt.selected=true;
    bilingualLangSelect.appendChild(opt);
  }
  if(bilingualLangSelect.options.length===0){
    // All langs are ko, no bilingual possible
    bilingualToggle.style.display='none';
  }else{
    bilingualToggle.style.display='';
  }

  langSelect.value=currentLang;
  bilingualLangSelect.value=bilingualLang;
}

// ===== YouTube IFrame API =====
var tag=document.createElement('script');
tag.src='https://www.youtube.com/iframe_api';
document.getElementsByTagName('script')[0].parentNode.insertBefore(tag,document.getElementsByTagName('script')[0]);
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('youtubePlayer',{
    height:'100%',width:'100%',videoId:'',
    playerVars:{autoplay:0,controls:1,rel:0,modestbranding:1},
    events:{onReady:onPlayerReady,onStateChange:onPlayerStateChange}
  });
};
function onPlayerReady(){
  playerReady=true;
  if(pendingPlay){var p=pendingPlay;pendingPlay=null;playAt(p.vIdx,p.sIdx,p.startTime,p.lang);}
}
function onPlayerStateChange(e){if(e.data===YT.PlayerState.PLAYING)startSync();else stopSync();}

// ===== Subtitle Sync =====
function startSync(){stopSync();syncInterval=setInterval(syncSubtitle,250);}
function stopSync(){if(syncInterval){clearInterval(syncInterval);syncInterval=null;}}

function syncSubtitle(){
  if(!player||!playerReady||currentVideoIdx<0)return;
  try{
    var ct=player.getCurrentTime();
    var subs=videos[currentVideoIdx].subtitles[currentLang];
    if(!subs||subs.length===0){updateFloatingSubtitle(ct);return;}
    var active=activeSubtitlesAt(subs,ct);
    var nextIdx=active.length?active[0].idx:-1;
    if(nextIdx!==currentSubIdx){currentSubIdx=nextIdx;highlightCurrentSubtitle();scrollToCurrentSubtitle();}
    updateFloatingSubtitle(ct);
  }catch(e){}
}

function highlightCurrentSubtitle(){
  var lines=subtitleOverlay.querySelectorAll('.sub-line');
  for(var i=0;i<lines.length;i++)lines[i].classList.toggle('current',parseInt(lines[i].dataset.idx)===currentSubIdx&&lines[i].dataset.lang===currentLang);
  var items=resultsList.querySelectorAll('.sub-item');
  for(var i=0;i<items.length;i++){
    var v=parseInt(items[i].dataset.v),s=parseInt(items[i].dataset.s);
    items[i].classList.toggle('active',v===currentVideoIdx&&s===currentSubIdx);
  }
}

function scrollToCurrentSubtitle(){
  if(currentSubIdx<0)return;
  var line=subtitleOverlay.querySelector('.sub-line.current');
  if(line)line.scrollIntoView({block:'center',behavior:'smooth'});
}

function updateFloatingSubtitle(currentTime){
  if(!floatingSubtitle||!floatingSubtitlesEnabled||currentVideoIdx<0){
    hideFloatingSubtitle();return;
  }
  var video=videos[currentVideoIdx],lines=[];
  if(!video){hideFloatingSubtitle();return;}

  var primary=activeSubtitlesAt(video.subtitles[currentLang]||[],currentTime);
  for(var i=0;i<primary.length;i++)lines.push({text:primary[i].text,secondary:false});

  if(bilingualMode&&bilingualLang!==currentLang){
    var secondary=activeSubtitlesAt(video.subtitles[bilingualLang]||[],currentTime);
    for(var j=0;j<secondary.length;j++)lines.push({text:secondary[j].text,secondary:true});
  }

  if(lines.length===0){hideFloatingSubtitle();return;}
  floatingSubtitle.innerHTML=lines.map(function(line){
    return '<div class="float-line '+(line.secondary?'secondary':'')+'">'+escHtml(line.text)+'</div>';
  }).join('');
  floatingSubtitle.classList.remove('hidden');
}

function hideFloatingSubtitle(){
  if(floatingSubtitle){floatingSubtitle.classList.add('hidden');floatingSubtitle.innerHTML='';}
}

function activeSubtitlesAt(subs,currentTime){
  if(!subs||subs.length===0||currentTime===undefined||currentTime===null)return [];
  var active=[];
  for(var i=0;i<subs.length;i++){
    if(subs[i].start>currentTime)break;
    if(subs[i].start<=currentTime&&currentTime<=subs[i].end){
      active.push({idx:i,text:subs[i].text,start:subs[i].start,end:subs[i].end});
    }
  }
  return active;
}

function applyClickedResultLanguage(vIdx,lang){
  var video=videos[vIdx];if(!video||!lang||!video.subtitles||!video.subtitles[lang])return;
  if(!video.subtitles[currentLang]){
    currentLang=lang;
  }else if(bilingualMode&&lang!==currentLang){
    bilingualLang=lang;
  }
  normalizeVideoLanguageState(vIdx);
}

function activePrimaryIndexAt(vIdx,currentTime){
  var video=videos[vIdx];if(!video)return -1;
  var active=activeSubtitlesAt(video.subtitles[currentLang]||[],currentTime);
  return active.length?active[0].idx:-1;
}

// ===== Search =====
function doSearch(query){
  if(!dataReady)return;
  query=query.trim().toLowerCase();currentQuery=query;
  if(!query){showEmptyState();clearBtn.classList.remove('visible');resultCount.textContent='';return;}
  setMobileResultsCollapsed(false);
  clearBtn.classList.add('visible');
  var results=[],terms=query.split(/\s+/).filter(function(t){return t.length>0});
  for(var i=0;i<searchIndex.length;i++){
    var text=searchIndex[i].text.toLowerCase(),ok=true;
    for(var j=0;j<terms.length;j++){if(text.indexOf(terms[j])===-1){ok=false;break}}
    if(ok)results.push(searchIndex[i]);
  }
  currentResults=results;
  renderResults(results,terms);
}

function renderResults(results,terms){
  if(results.length===0){
    emptyState.style.display='flex';resultsList.style.display='none';
    emptyState.querySelector('.icon').textContent='🐾';
    emptyState.querySelector('p').textContent=t('noResults',{query:currentQuery});
    resultCount.textContent=t('results',{count:'0'});return;
  }
  emptyState.style.display='none';resultsList.style.display='block';
  resultCount.textContent=t('results',{count:results.length.toLocaleString()});

  var groups={};
  for(var i=0;i<results.length;i++){
    var v=results[i].v;if(!groups[v])groups[v]=[];groups[v].push(results[i]);
  }
  var sorted=Object.entries(groups).sort(function(a,b){return b[1].length-a[1].length});
  var html='';
  for(var gi=0;gi<sorted.length;gi++){
    var vIdx=parseInt(sorted[gi][0]),entries=sorted[gi][1],video=videos[vIdx];
    var thumb='https://i.ytimg.com/vi/'+video.videoId+'/hqdefault.jpg';
    var show=Math.min(entries.length,30),more=entries.length>30;
    html+='<div class="video-group expanded" data-v="'+vIdx+'">';
    html+='<div class="video-group-header" onclick="event.stopPropagation();toggleGroup(this.parentElement)">';
    html+='<img class="thumb" src="'+thumb+'" loading="lazy" onerror="this.style.display=\'none\'" onclick="event.stopPropagation();loadVideoSubtitles('+vIdx+')" title="Load subtitles">';
    html+='<span class="vtitle" onclick="event.stopPropagation();loadVideoSubtitles('+vIdx+')" title="Load subtitles">'+escHtml(video.title)+'</span>';
    html+='<span class="vcount">'+entries.length+'</span>';
    html+='<span class="expand-icon">▼</span></div><div class="sub-items">';
    for(var i=0;i<show;i++)html+=renderSubItem(entries[i],terms);
    if(more)html+='<div class="sub-item" style="color:var(--text-dim);cursor:default">... and '+(entries.length-show)+' more</div>';
    html+='</div></div>';
  }
  resultsList.innerHTML=html;
}

function renderSubItem(entry,terms){
  return '<div class="sub-item" data-v="'+entry.v+'" data-s="'+entry.s+'" data-lang="'+entry.lang+'" onclick="playAt('+entry.v+','+entry.s+','+entry.start+',\''+entry.lang+'\')">'+
    '<span class="sub-time">'+formatTime(entry.start)+'</span>'+
    '<span class="lang-badge '+entry.lang+'">'+entry.lang.toUpperCase()+'</span>'+
    '<span class="sub-text">'+highlightTerms(entry.text,terms)+'</span></div>';
}

// ===== Video Playback =====
function playAt(vIdx,sIdx,startTime,lang){
  var video=videos[vIdx];if(!video||!video.videoId)return;
  applyClickedResultLanguage(vIdx,lang);
  currentVideoIdx=vIdx;currentSubIdx=activePrimaryIndexAt(vIdx,startTime);
  localSubtitleSearch.value=localSubtitleQuery;

  if(!player||!playerReady){pendingPlay={vIdx:vIdx,sIdx:sIdx,startTime:startTime,lang:lang};playerPlaceholder.style.display='none';renderSubtitles(vIdx);hideFloatingSubtitle();updateVideoInfo(video);return;}
  try{
    var vd=player.getVideoData?player.getVideoData():null;
    if(vd&&vd.video_id===video.videoId){player.seekTo(startTime,true);player.playVideo();}
    else player.loadVideoById({videoId:video.videoId,startSeconds:startTime,suggestedQuality:'default'});
  }catch(e){player.loadVideoById({videoId:video.videoId,startSeconds:startTime,suggestedQuality:'default'});}
  playerPlaceholder.style.display='none';
  renderSubtitles(vIdx);
  setMobileResultsCollapsed(true);
  setTimeout(function(){highlightCurrentSubtitle();scrollToCurrentSubtitle();updateFloatingSubtitle(startTime);},400);
  updateVideoInfo(video);
}

function loadVideoSubtitles(vIdx,lang){
  var video=videos[vIdx];if(!video)return;
  if(lang)currentLang=lang;
  currentVideoIdx=vIdx;currentSubIdx=-1;
  localSubtitleQuery='';
  localSubtitleSearch.value='';
  if(player&&playerReady){try{player.loadVideoById({videoId:video.videoId,startSeconds:0,suggestedQuality:'default'});}catch(e){}}
  playerPlaceholder.style.display='none';
  renderSubtitles(vIdx);
  hideFloatingSubtitle();
  setMobileResultsCollapsed(true);
  updateVideoInfo(video);
}

function renderSubtitles(vIdx){
  normalizeVideoLanguageState(vIdx);
  var subs=videos[vIdx].subtitles[currentLang];
  if(!subs||subs.length===0){
    // Try to find any available language
    var avail=Object.keys(videos[vIdx].subtitles);
    if(avail.length>0){currentLang=avail[0];normalizeVideoLanguageState(vIdx);subs=videos[vIdx].subtitles[currentLang];}
    else{subtitleOverlay.innerHTML='<div class="no-subs-hint">'+t('noVideoSubs')+'</div>';return;}
  }

  if(bilingualMode){
    renderBilingualSubtitles(vIdx);return;
  }

  var globalTerms=currentQuery?currentQuery.split(/\s+/).filter(function(t){return t.length>0}):[];
  var localTerms=localSubtitleTerms();
  var terms=globalTerms.concat(localTerms);
  var html='';
  var shown=0;
  for(var i=0;i<subs.length;i++){
    if(!matchesTerms(subs[i].text,localTerms))continue;
    var txt=terms.length>0?highlightTerms(subs[i].text,terms):escHtml(subs[i].text);
    html+='<div class="sub-line '+currentLang+'" data-idx="'+i+'" data-lang="'+currentLang+'" onclick="seekSubtitle('+i+')"><span class="stime">'+formatTime(subs[i].start)+'</span>'+txt+'</div>';
    shown++;
  }
  subtitleOverlay.innerHTML=shown?html:'<div class="no-subs-hint">'+t('noLocalResults')+'</div>';
  subtitleOverlay.scrollTop=0;
}

function renderBilingualSubtitles(vIdx){
  normalizeVideoLanguageState(vIdx);
  var primary=videos[vIdx].subtitles[currentLang]||[];
  var secondary=videos[vIdx].subtitles[bilingualLang]||[];
  if(secondary.length===0){
    var old=bilingualMode;bilingualMode=false;renderSubtitles(vIdx);bilingualMode=old;return;
  }

  // Merge and interleave by start time
  var merged=[];
  for(var i=0;i<primary.length;i++)merged.push({lang:currentLang,idx:i,start:primary[i].start,text:primary[i].text});
  for(var i=0;i<secondary.length;i++)merged.push({lang:bilingualLang,idx:i,start:secondary[i].start,text:secondary[i].text});
  merged.sort(function(a,b){return a.start-b.start});

  var globalTerms=currentQuery?currentQuery.split(/\s+/).filter(function(t){return t.length>0}):[];
  var localTerms=localSubtitleTerms();
  var terms=globalTerms.concat(localTerms);
  var html='';
  var shown=0;
  for(var i=0;i<merged.length;i++){
    var e=merged[i],txt=terms.length>0?highlightTerms(e.text,terms):escHtml(e.text);
    if(!matchesTerms(e.text,localTerms))continue;
    html+='<div class="sub-line '+e.lang+'" data-idx="'+e.idx+'" data-lang="'+e.lang+'" data-start="'+e.start+'" onclick="seekSubtitleInLang(\''+e.lang+'\','+e.idx+')">'+
      '<span class="stime">'+formatTime(e.start)+'</span>'+
      '<span class="lang-badge '+e.lang+'">'+e.lang.toUpperCase()+'</span>'+txt+'</div>';
    shown++;
  }
  subtitleOverlay.innerHTML=shown?html:'<div class="no-subs-hint">'+t('noLocalResults')+'</div>';
  subtitleOverlay.scrollTop=0;
}

function normalizeVideoLanguageState(vIdx){
  var video=videos[vIdx];if(!video)return;
  var avail=Object.keys(video.subtitles||{});
  if(avail.length===0)return;
  if(avail.indexOf(currentLang)<0)currentLang=avail[0];
  if(avail.length>1&&(avail.indexOf(bilingualLang)<0||bilingualLang===currentLang)){
    bilingualLang=avail.filter(function(l){return l!==currentLang})[0]||bilingualLang;
  }
  if(avail.length<2){
    bilingualMode=false;
    bilingualCheck.checked=false;
    bilingualToggle.classList.remove('active');
    bilingualLangSelect.style.display='none';
  }
  langSelect.value=currentLang;
  rebuildBilingualLangOptions(avail);
}

function rebuildBilingualLangOptions(avail){
  bilingualLangSelect.innerHTML='';
  for(var i=0;i<avail.length;i++){
    if(avail[i]===currentLang)continue;
    var opt=document.createElement('option');
    opt.value=avail[i];opt.textContent=LANG_LABELS[avail[i]]||avail[i];
    if(avail[i]===bilingualLang)opt.selected=true;
    bilingualLangSelect.appendChild(opt);
  }
  bilingualToggle.style.display=avail.length>1?'':'none';
  bilingualLangSelect.value=bilingualLang;
}

function seekSubtitle(idx){
  if(!player||!playerReady||currentVideoIdx<0)return;
  var subs=videos[currentVideoIdx].subtitles[currentLang];
  if(idx>=0&&idx<subs.length){currentSubIdx=idx;player.seekTo(subs[idx].start,true);player.playVideo();highlightCurrentSubtitle();updateFloatingSubtitle(subs[idx].start);}
}

function seekSubtitleInLang(lang,idx){
  if(!player||!playerReady||currentVideoIdx<0)return;
  var subs=videos[currentVideoIdx].subtitles[lang];
  if(idx>=0&&subs&&idx<subs.length){
    applyClickedResultLanguage(currentVideoIdx,lang);
    currentSubIdx=activePrimaryIndexAt(currentVideoIdx,subs[idx].start);
    player.seekTo(subs[idx].start,true);
    player.playVideo();
    highlightCurrentSubtitle();
    updateFloatingSubtitle(subs[idx].start);
  }
}

function updateVideoInfo(video){
  var bar=document.getElementById('videoInfoBar'),thumb=document.getElementById('videoInfoThumb'),title=document.getElementById('videoInfoTitle');
  if(video&&video.videoId){
    bar.classList.add('visible');
    localSubtitleSearch.classList.remove('hidden');
    thumb.src='https://i.ytimg.com/vi/'+video.videoId+'/hqdefault.jpg';title.textContent=video.title;
  }
  else{
    bar.classList.remove('visible');
    localSubtitleSearch.classList.add('hidden');
  }
}

// ===== Browse Mode =====
function renderBrowseView(){
  var sortBy=document.getElementById('browseSort').value;
  var filterSubs=document.getElementById('filterHasSubs').checked;
  var filterLang=document.getElementById('filterLang').value;

  var filtered=[];
  for(var i=0;i<videos.length;i++){
    var v=videos[i],hasSubs=Object.keys(v.subtitles).length>0;
    if(filterSubs&&!hasSubs)continue;
    if(filterLang&&!v.subtitles[filterLang])continue;
    filtered.push({idx:i,video:v});
  }

  if(sortBy==='newest')filtered.reverse(); // playlist is newest-first, reverse for oldest-first... wait, playlist is newest first
  else if(sortBy==='title')filtered.sort(function(a,b){return a.video.title.localeCompare(b.video.title,'ko')});

  var grid=document.getElementById('videoGrid'),html='';
  for(var i=0;i<filtered.length;i++){
    var item=filtered[i],v=item.video;
    var thumb=v.thumbnailUrl||('https://i.ytimg.com/vi/'+v.videoId+'/hqdefault.jpg');
    var durStr=formatDuration(v.duration);
    var badges='',langs=Object.keys(v.subtitles);
    for(var j=0;j<langs.length;j++)badges+='<span class="lang-badge '+langs[j]+'">'+langs[j].toUpperCase()+'</span>';

    html+='<div class="video-card" onclick="loadVideoSubtitles('+item.idx+');switchMode(\'search\');">'+
      '<img class="card-thumb" src="'+thumb+'" loading="lazy" onerror="this.style.background=\'var(--surface2)\'">'+
      '<div class="card-body">'+
        '<div class="card-title">'+escHtml(v.title)+'</div>'+
        '<div class="card-meta">'+(durStr?'<span>⏱ '+durStr+'</span>':'')+'<span>'+badges+'</span></div>'+
      '</div></div>';
  }
  grid.innerHTML=html||'<div class="empty-state" style="grid-column:1/-1"><p>'+t('noVideos')+'</p></div>';
}

function switchMode(mode){
  currentMode=mode;
  document.getElementById('modeSearchBtn').classList.toggle('active',mode==='search');
  document.getElementById('modeBrowseBtn').classList.toggle('active',mode==='browse');
  if(mode==='search'){
    setMobileResultsCollapsed(false);
    searchWrap.style.display='';resultsList.style.display=currentQuery?'block':'none';
    emptyState.style.display=currentQuery?'none':'flex';browseView.style.display='none';
  }else{
    setMobileResultsCollapsed(false);
    searchWrap.style.display='none';resultsList.style.display='none';emptyState.style.display='none';
    browseView.style.display='flex';renderBrowseView();
  }
}

// ===== Helpers =====
function toggleGroup(el){el.classList.toggle('expanded')}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function highlightTerms(text,terms){
  if(!terms||terms.length===0)return escHtml(text);
  var e=[];for(var i=0;i<terms.length;i++)e.push(terms[i].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  var re=new RegExp('('+e.join('|')+')','gi'),r='',li=0,m;
  while((m=re.exec(text))!==null){r+=escHtml(text.slice(li,m.index))+'<mark>'+escHtml(m[0])+'</mark>';li=re.lastIndex}
  return r+escHtml(text.slice(li));
}

function localSubtitleTerms(){
  return localSubtitleQuery.trim().toLowerCase().split(/\s+/).filter(function(t){return t.length>0});
}

function matchesTerms(text,terms){
  if(!terms||terms.length===0)return true;
  var lower=text.toLowerCase();
  for(var i=0;i<terms.length;i++){if(lower.indexOf(terms[i])===-1)return false;}
  return true;
}

function formatTime(s){
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60);
  return h>0?h+':'+pad(m)+':'+pad(sec):m+':'+pad(sec);
}
function formatDuration(s){if(!s||s<=0)return'';return formatTime(s)}
function pad(n){return n<10?'0'+n:''+n}

function showEmptyState(){
  currentResults=[];emptyState.style.display='flex';resultsList.style.display='none';
  emptyState.querySelector('.icon').textContent='🐱';
  emptyState.querySelector('p').textContent=t('empty');
  resultCount.textContent='';
}

function isMobileViewport(){
  return window.matchMedia('(max-width: 768px), (max-width: 900px) and (orientation: landscape) and (max-height: 520px)').matches;
}

function setMobileResultsCollapsed(collapsed){
  if(!mainEl)return;
  if(!isMobileViewport())collapsed=false;
  mainEl.classList.toggle('results-collapsed',!!collapsed);
  updateMobileResultsToggle();
}

function updateMobileResultsToggle(){
  if(!mainEl||!mobileResultsToggle)return;
  mobileResultsToggle.textContent=mainEl.classList.contains('results-collapsed')?'Show results':'Hide results';
}

function currentPlayerTime(){
  if(!player||!playerReady)return null;
  try{return player.getCurrentTime();}catch(e){return null;}
}

function toggleFloatingSubtitles(){
  floatingSubtitlesEnabled=!floatingSubtitlesEnabled;
  floatingSubtitleBtn.classList.toggle('active',floatingSubtitlesEnabled);
  if(floatingSubtitlesEnabled)updateFloatingSubtitle(currentPlayerTime());
  else hideFloatingSubtitle();
}

function togglePlayerFullscreen(){
  if(!playerContainer)return;
  var fullscreenElement=document.fullscreenElement||document.webkitFullscreenElement;
  if(fullscreenElement){
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }else if(playerContainer.requestFullscreen){
    playerContainer.requestFullscreen();
  }else if(playerContainer.webkitRequestFullscreen){
    playerContainer.webkitRequestFullscreen();
  }
}

function updateFullscreenButton(){
  var fullscreenElement=document.fullscreenElement||document.webkitFullscreenElement;
  var active=fullscreenElement===playerContainer;
  if(playerFullscreenBtn)playerFullscreenBtn.classList.toggle('active',active);
  if(playerFullscreenBtn)playerFullscreenBtn.textContent=active?'Exit fullscreen':'Fullscreen';
}

// ===== Events =====
var debounce=null;
searchInput.addEventListener('input',function(){clearTimeout(debounce);debounce=setTimeout(function(){doSearch(searchInput.value)},200)});
searchInput.addEventListener('keydown',function(e){if(e.key==='Escape'){searchInput.value='';doSearch('');searchInput.blur()}});
clearBtn.addEventListener('click',function(){searchInput.value='';doSearch('');searchInput.focus()});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();searchInput.focus();searchInput.select()}});
mobileResultsToggle.addEventListener('click',function(){
  if(!mainEl)return;
  setMobileResultsCollapsed(!mainEl.classList.contains('results-collapsed'));
});
window.addEventListener('resize',function(){setMobileResultsCollapsed(mainEl&&mainEl.classList.contains('results-collapsed'))});
floatingSubtitleBtn.addEventListener('click',toggleFloatingSubtitles);
playerFullscreenBtn.addEventListener('click',togglePlayerFullscreen);
document.addEventListener('fullscreenchange',function(){updateFullscreenButton();updateFloatingSubtitle(currentPlayerTime());});
document.addEventListener('webkitfullscreenchange',function(){updateFullscreenButton();updateFloatingSubtitle(currentPlayerTime());});
localSubtitleSearch.addEventListener('input',function(){
  localSubtitleQuery=this.value;
  if(currentVideoIdx>=0)renderSubtitles(currentVideoIdx);
});

// Language events
langSelect.addEventListener('change',function(){
  currentLang=this.value;
  if(currentVideoIdx>=0)normalizeVideoLanguageState(currentVideoIdx);
  if(currentVideoIdx>=0)renderSubtitles(currentVideoIdx);
  updateFloatingSubtitle(currentPlayerTime());
});
bilingualToggle.addEventListener('click',function(e){
  e.preventDefault();
  if(currentVideoIdx>=0){
    normalizeVideoLanguageState(currentVideoIdx);
    if(bilingualLangSelect.options.length===0)return;
  }
  bilingualMode=!bilingualMode;bilingualCheck.checked=bilingualMode;
  bilingualToggle.classList.toggle('active',bilingualMode);
  bilingualLangSelect.style.display=bilingualMode?'':'none';
  if(currentVideoIdx>=0)renderSubtitles(currentVideoIdx);
  updateFloatingSubtitle(currentPlayerTime());
});
bilingualLangSelect.addEventListener('change',function(){bilingualLang=this.value;if(bilingualMode&&currentVideoIdx>=0)renderSubtitles(currentVideoIdx);updateFloatingSubtitle(currentPlayerTime())});

// Mode events
document.getElementById('modeSearchBtn').addEventListener('click',function(){switchMode('search')});
document.getElementById('modeBrowseBtn').addEventListener('click',function(){switchMode('browse')});

// Browse events
document.getElementById('browseSort').addEventListener('change',renderBrowseView);
document.getElementById('filterHasSubs').addEventListener('change',renderBrowseView);
document.getElementById('filterLang').addEventListener('change',renderBrowseView);

// Reload
document.getElementById('btnReload').addEventListener('click',function(){
  currentQuery='';currentVideoIdx=-1;currentSubIdx=-1;currentResults=[];
  localSubtitleQuery='';localSubtitleSearch.value='';localSubtitleSearch.classList.add('hidden');
  hideFloatingSubtitle();
  searchInput.value='';resultCount.textContent='';
  emptyState.style.display='flex';resultsList.style.display='none';browseView.style.display='none';
  setMobileResultsCollapsed(false);
  subtitleOverlay.innerHTML='<div class="no-subs-hint">🐾 '+t('subsEmpty')+'</div>';
  document.getElementById('videoInfoBar').classList.remove('visible');
  playerPlaceholder.style.display='flex';clearBtn.classList.remove('visible');
  loadData();
});

// ===== Init =====
applyUiText();
loadData();
</script>
